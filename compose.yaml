services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_change_me
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      DEMO_MODE: "false"
      DATABASE_URL: sqlite:////app/data/logs.db
      SECRET_KEY: ${SECRET_KEY:-demo-insecure-secret-key-32-characters-min}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/master/.well-known/openid-configuration
      OIDC_CLIENT_ID: log-anomaly-detector
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: http://127.0.0.1:8000/api/auth/callback
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.chris-vo.com/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  keycloak_data:
  backend_data:
